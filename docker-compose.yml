services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokepass}
      POSTGRES_DB: ${POSTGRES_DB:-pokedb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokeuser} -d ${POSTGRES_DB:-pokedb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: elestio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  data-ingestion:
    build:
      context: .
      dockerfile: services/data-ingestion/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pokeuser:pokepass@postgres:5432/pokedb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: ${MINIO_SECURE:-"false"}
      MINIO_BUCKET: ${MINIO_BUCKET:-pokemon-cards}
      IMAGE_STORAGE_PATH: ${IMAGE_STORAGE_PATH:-/app/images}
    volumes:
      - ./services/data-ingestion:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  scraper:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    ports: []
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pokeuser:pokepass@postgres:5432/pokedb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: ${MINIO_SECURE:-"false"}
      MINIO_BUCKET: ${MINIO_BUCKET:-pokemon-cards}
      DATA_API_URL: ${DATA_API_URL:-http://data-ingestion:8000}
      JUSTTCG_API_KEY: ${JUSTTCG_API_KEY}
    depends_on:
      data-ingestion:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  recognition:
    build:
      context: .
      dockerfile: services/recognition/Dockerfile
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pokeuser:pokepass@postgres:5432/pokedb}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: ${MINIO_SECURE:-"false"}
      MINIO_BUCKET: ${MINIO_BUCKET:-pokemon-cards}
      PYTHONUNBUFFERED: "1"
    depends_on:
      data-ingestion:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      recognition:
        condition: service_started

volumes:
  pgdata:
  minio-data:
  redis-data: