[package]
name = "pokex"
version = "0.1.0"
description = "Pokex - Pokemon TCG Collection Manager"
authors = ["Bruno"]
edition = "2021"

[lib]
name = "pokex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
libsql = "0.10.0-pre.4"
reqwest = { version = "0.13", features = ["json", "rustls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "1"
moka = { version = "0.12", features = ["future"] }
once_cell = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[dev-dependencies]
tokio-test = "0.4"
