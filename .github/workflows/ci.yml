name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.0"

jobs:
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    outputs:
      pnpm-cache-key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      uv-cache-key: ${{ steps.uv-cache.outputs.cache-primary-key }}
      cargo-cache-key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache pnpm store
        id: pnpm-cache
        uses: actions/cache@v4
        with:
          path: |
            apps/web/node_modules
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Cache uv
        id: uv-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('services/**/uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Cache cargo
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            apps/desktop-mobile/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Install Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: test-python
            service: data-ingestion
            workers: "4"
          - target: test-python
            service: recognition
            workers: "2"
          - target: test-python
            service: scraper
            workers: "4"
          - target: test-web
          - target: test-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: matrix.target == 'test-web'
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        if: matrix.target == 'test-web'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        if: matrix.target == 'test-web'
        id: pnpm-restore
        with:
          path: |
            apps/web/node_modules
            ~/.local/share/pnpm/store
          key: ${{ needs.setup.outputs.pnpm-cache-key }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install pnpm deps
        if: matrix.target == 'test-web'
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - uses: astral-sh/setup-uv@v4
        if: matrix.target == 'test-python'
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - uses: actions/cache@v4
        if: matrix.target == 'test-python'
        id: uv-restore
        with:
          path: ~/.cache/uv
          key: ${{ needs.setup.outputs.uv-cache-key }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Sync Python deps
        if: matrix.target == 'test-python'
        run: |
          cd services/${{ matrix.service }}
          uv sync --extra dev --frozen

      - name: Test Python
        if: matrix.target == 'test-python'
        run: |
          cd services/${{ matrix.service }}
          uv run pytest test/ -v --tb=short -n ${{ matrix.workers }}
        env:
          REDIS_URL: redis://localhost:6379/0

      - uses: actions/cache@v4
        if: matrix.target == 'test-web'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright
        if: matrix.target == 'test-web'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Test Web
        if: matrix.target == 'test-web'
        run: pnpm --filter web run test

      - name: Build web artifact
        if: matrix.target == 'test-web'
        run: pnpm --filter web run build

      - name: Upload web dist
        if: matrix.target == 'test-web'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == 'test-desktop'
        with:
          target: x86_64-unknown-linux-gnu

      - uses: actions/cache@v4
        if: matrix.target == 'test-desktop'
        id: cargo-restore
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            apps/desktop-mobile/src-tauri/target
          key: ${{ needs.setup.outputs.cargo-cache-key }}

      - name: Test Desktop
        if: matrix.target == 'test-desktop'
        run: |
          cd apps/desktop-mobile/src-tauri
          cargo test --lib

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [setup, test]
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - uses: actions/cache@v4
        id: uv-restore
        with:
          path: ~/.cache/uv
          key: ${{ needs.setup.outputs.uv-cache-key }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Sync Python deps
        run: |
          cd services/data-ingestion && uv sync --extra dev --frozen
          cd ../recognition && uv sync --extra dev --frozen
          cd ../scraper && uv sync --extra dev --frozen

      - name: Run E2E tests
        run: pytest test/e2e/ -v --tb=short -n 4
        env:
          REDIS_URL: redis://localhost:6379/0

  build:
    name: Build & Docker
    runs-on: ubuntu-latest
    needs: [test, test-e2e]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Validate docker-compose
        run: docker compose config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker images (parallel)
        run: |
          docker buildx bake -f docker-bake.hcl