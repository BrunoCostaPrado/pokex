name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.0"

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
      - name: Install Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

  test:
    name: Tests
    runs-on: ubuntu-24.04
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: test-python
            service: data-ingestion
            workers: "4"
          - target: test-python
            service: recognition
            workers: "2"
          - target: test-web
          - target: test-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: matrix.target == 'test-web'
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        if: matrix.target == 'test-web'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm deps
        if: matrix.target == 'test-web'
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - uses: astral-sh/setup-uv@v4
        if: matrix.target == 'test-python'
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Sync Python deps
        if: matrix.target == 'test-python'
        run: |
          cd services/${{ matrix.service }}
          uv sync --extra dev --frozen

      - name: Test Python
        if: matrix.target == 'test-python'
        run: |
          cd services/${{ matrix.service }}
          uv run pytest test/ -v --tb=short -n ${{ matrix.workers }}
        env:
          REDIS_URL: redis://localhost:6379/0

      - name: Install Playwright
        if: matrix.target == 'test-web'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Test Web
        if: matrix.target == 'test-web'
        run: pnpm --filter web run test

      - name: Build web artifact
        if: matrix.target == 'test-web'
        run: pnpm --filter web run build

      - name: Upload web dist
        if: matrix.target == 'test-web'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == 'test-desktop'
        with:
          target: x86_64-unknown-linux-gnu

      - name: Install GTK dependencies
        if: matrix.target == 'test-desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Test Desktop
        if: matrix.target == 'test-desktop'
        run: |
          cd apps/desktop-mobile/src-tauri
          cargo test --lib