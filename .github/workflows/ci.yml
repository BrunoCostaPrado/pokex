name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.0"

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
      - name: Install Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

  test:
    name: Tests
    runs-on: ubuntu-24.04
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: test-web
          - target: test-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: matrix.target == 'test-web'
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        if: matrix.target == 'test-web'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm deps
        if: matrix.target == 'test-web'
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      

      - name: Install Playwright
        if: matrix.target == 'test-web'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Test Web
        if: matrix.target == 'test-web'
        run: pnpm --filter web run test

      - name: Build web artifact
        if: matrix.target == 'test-web'
        run: pnpm --filter web run build

      - name: Upload web dist
        if: matrix.target == 'test-web'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == 'test-desktop'
        with:
          target: x86_64-unknown-linux-gnu

      - name: Install GTK dependencies
        if: matrix.target == 'test-desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Test Desktop
        if: matrix.target == 'test-desktop'
        run: |
          cd apps/desktop-mobile/src-tauri
          cargo test --lib

  build:
    name: Build & Docker
    runs-on: ubuntu-24.04
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker images (parallel)
        run: |
          docker buildx bake -f docker-bake.hcl

  build-desktop:
    name: Build Desktop (Linux)
    runs-on: ubuntu-24.04
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu
      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build Desktop app
        run: |
          cd apps/desktop-mobile
          pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
          pnpm run build
          pnpm run tauri build --target x86_64-unknown-linux-gnu
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundles
          path: apps/desktop-mobile/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/
          if-no-files-found: warn

  build-android:
    name: Build Android (3 archs)
    runs-on: ubuntu-24.04
    needs: [test]
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64, i686]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pnpm deps (root)
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
      - name: Install pnpm deps (desktop-mobile)
        run: |
          cd apps/desktop-mobile
          pnpm install --frozen-lockfile --prefer-offline --ignore-scripts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-linux-android
      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 ndk;27.0.12077973 build-tools;35.0.0
      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Create keystore from secrets
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > apps/desktop-mobile/src-tauri/gen/android/pokex-release.keystore
      - name: Build Android app (debug)
        run: |
          cd apps/desktop-mobile
          pnpm run tauri android build --target ${{ matrix.arch }} --debug
      - name: Upload Android artifacts (debug)
        uses: actions/upload-artifact@v4
        with:
          name: android-bundles-${{ matrix.arch }}
          path: |
            apps/desktop-mobile/src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn