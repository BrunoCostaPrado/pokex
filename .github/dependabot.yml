version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    target-branch: "main"
    groups:
      dev-dependencies:
        patterns:
          - "*"
        dependency-type: "development"
      dependencies:
        patterns:
          - "*"
        dependency-type: "production"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/services/data-ingestion"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    target-branch: "main"
    groups:
      data-ingestion-deps:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

  - package-ecosystem: "pip"
