[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scraper"
version = "0.1.0"
description = "Pokemon TCG Scraper Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "sqlalchemy>=2.1.1",
    "greenlet>=3.5.6",
    "asyncpg>=0.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "pytest-xdist==3.6.1",
    "ruff==0.7.0",
    "mypy==1.13.0",
    "redis==5.0.1",
    "numpy==1.26.4",
    "opencv-python-headless==4.10.0.84",
    "pillow==10.4.0",
    "pytesseract==0.3.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "UP007"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper_app*", "scraper_app.sources*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["../../test/python"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "ruff>=0.7.0",
]
